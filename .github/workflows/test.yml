name: Test

on:
  push:
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/test.yml'
      - '.golangci.yml'
  pull_request:
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/test.yml'
      - '.golangci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Check server
        run: |
          go vet ./...
          go test -race ./...

      - name: Check demo
        working-directory: demos/supply-chain-detective
        run: |
          go vet ./...
          go test ./...

      - name: Lint server and demo
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint run --timeout 5m ./...
          (cd demos/supply-chain-detective && golangci-lint run --config ../../.golangci.yml --timeout 5m ./...)
